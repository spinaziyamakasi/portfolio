services:
  db:
    image: postgres:18
    container_name: databasement-db
    environment:
      POSTGRES_USER: databasement
      POSTGRES_PASSWORD: databasement
      POSTGRES_DB: databasement
      # Sample data is the default. Set USE_FULL_DATASET=true in .env (and run
      # docker compose down -v) to load db/seed/full/ instead.
      USE_FULL_DATASET: ${USE_FULL_DATASET:-}
    ports:
      - "${DB_PORT:-58432}:5432"
    volumes:
      - db-data:/var/lib/postgresql
      - ./db:/db
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      # Healthy only when the database is reachable over TCP (i.e. init has
      # finished -- the temporary init server has no TCP listener) AND the seed
      # data actually loaded. Without the second check, a failed first start
      # leaves an empty volume that looks "healthy" and every query then fails
      # with "relation does not exist".
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U databasement -d databasement && psql -h 127.0.0.1 -U databasement -d databasement -tAc 'SELECT EXISTS (SELECT 1 FROM orders)' | grep -q t"]
      interval: 3s
      timeout: 5s
      retries: 100
      start_period: 30s

  backend:
    build: ./backend
    container_name: databasement-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://databasement:databasement@db:5432/databasement
      PORT: 4000
      APP_ROOT: /app
    volumes:
      - ./sql:/app/sql:ro
      - ./widgets.yaml:/app/widgets.yaml:ro
      - ./grading:/app/grading:ro
      - ./db:/app/db:ro
    ports:
      - "${BACKEND_PORT:-58000}:4000"

  frontend:
    image: nginx:alpine
    container_name: databasement-frontend
    depends_on:
      - backend
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./sql:/usr/share/nginx/sql-src:ro
    ports:
      - "${FRONTEND_PORT:-58080}:80"

  grading:
    build:
      context: .
      dockerfile: grading/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://databasement:databasement@db:5432/databasement
    volumes:
      - ./:/app
    working_dir: /app
    profiles: ["tools"]

volumes:
  db-data:
